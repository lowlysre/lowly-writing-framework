name: review-comment-offered-fix
type: capability

agent_environment:
  skills:
    - ../../skills/lowly-writing-framework

defaults:
  runs: 1
  timeout: 5m
  judge_model: claude-sonnet-5.5

stimuli:
  - name: review-comment-offered-fix
    prompt: "Use the lowly-writing-framework skill. Draft two review comments for acme/sdk#91, no need to post them. First: `sdk/cache.py` line 30 loads the whole cache file into memory on every lookup, which will hurt on large caches. I don't care how it's fixed, an LRU, an index, lazy loading, whatever, but I have one idea: memoize the parsed file with functools.lru_cache. Second: `sdk/auth.py` line 12 builds the token header by string concatenation; it has to use the existing `build_auth_header()` helper, because that's the only path that redacts the token in debug logs."
    rubric:
      - "Each comment opens with a plain-text conventional comment label"
      - "The cache comment leads with the problem (full file load per lookup) and why it matters, before any fix"
      - "The lru_cache idea is marked as one option or an example, and the comment makes clear any fix for the stated problem resolves it"
      - "The cache comment doesn't present lru_cache as a required implementation, either in prose or as a suggested-edit block without an illustrative marker"
      - "The auth comment prescribes build_auth_header() and states the reason in the same comment: it's the only path that redacts the token in debug logs"
      - "<!--:robot:--> is the literal last line of each comment"
    graders:
      - type: prompt
        config:
          prompt: "Grade the agent's final answer against every rubric criterion."
          scoring: scale_1_5

scoring:
  threshold: 0.7
