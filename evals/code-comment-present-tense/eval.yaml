name: code-comment-present-tense
type: capability

agent_environment:
  skills:
    - ../.skill/lowly-writing-framework-eval

defaults:
  runs: 1
  timeout: 5m
  judge_model: claude-sonnet-5.5

stimuli:
  - name: code-comment-present-tense
    prompt: "Use the lowly-writing-framework-eval skill and no other skill. Add an inline code comment above the `for attempt in range(3):` loop in `client.py` explaining it. Background: we added the retry last week in PR acme/api#482 after an outage, because the vendor's gateway drops roughly 1 in 200 connections under load. There's a vendor bug filed upstream as vendor-org/gateway#91 that would make the retry unnecessary once fixed. This is a simulated scenario: the repository, PR, and account do not exist and no network or gh call will succeed. Do not run commands. Reply with the exact artifact text and, for anything that would be posted through gh or a tool, the exact commands you would run, in order."
    rubric:
      - "The comment describes current behavior in present tense, with no history such as 'added', 'after the outage', or 'last week'"
      - "The comment doesn't cite acme/api#482 or any other PR or issue from this repo"
      - "Citing the upstream vendor-org/gateway#91 bug is acceptable, and if cited it uses the full owner/repo#123 form"
      - "The comment is 4 lines or fewer"
    graders:
      - type: prompt
        config:
          prompt: "Grade the agent's final answer against every rubric criterion."
          scoring: scale_1_5
