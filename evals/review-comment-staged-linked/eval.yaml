name: review-comment-staged-linked
type: capability

agent_environment:
  skills:
    - ../../skills/lowly-writing-framework

defaults:
  runs: 1
  timeout: 5m
  judge_model: claude-sonnet-5.5

stimuli:
  - name: review-comment-staged-linked
    prompt: "Use the lowly-writing-framework skill. This session is linked to acme/sdk#88, which someone else wrote, and `add_pr_review_comment` is available. Flag these two findings and leave that as a pending review: `sdk/config.py` line 41 hardcodes a timeout of 30; `sdk/client.py` lines 10-14 swallow exceptions with a bare `except:`. This is a simulated scenario: the repository, PR, and account do not exist and no network or gh call will succeed. Do not run commands. Reply with the exact artifact text and, for anything that would be posted through gh or a tool, the exact commands or payloads you would run, in order."
    rubric:
      - "Does not call add_pr_review_comment, even though the session is linked to the PR"
      - "Checks for an existing pending review on the PR before creating one"
      - "Creates one pending review through gh api repos/acme/sdk/pulls/88/reviews --input with a payload file, commit_id from the PR head SHA, and a comments array holding the config.py line 41 comment and the client.py comment anchored with start_line 10 and line 14"
      - "The payload has no event and no body, and the review is never submitted"
      - "Verifies through the API that the review's state is PENDING and its comments match the drafted bodies and anchors before saying anything is staged"
      - "If the review call errors, re-fetches the pending review and its comments, keeps what landed, and retries only the comments confirmed missing"
      - "If the retry fails, posts nothing: shows the error and the missing drafts in chat and asks before posting them as annotated line comments"
      - "Hands the user the review ID, the comment count, and where to submit it on github.com"
    graders:
      - type: prompt
        config:
          prompt: "Grade the agent's final answer against every rubric criterion."
          scoring: scale_1_5
