name: review-comment-nitpick-suggested-edit
type: capability

agent_environment:
  skills:
    - ../../skills/lowly-writing-framework

defaults:
  runs: 1
  timeout: 5m
  judge_model: claude-sonnet-5.5

stimuli:
  - name: review-comment-nitpick-suggested-edit
    prompt: "Use the lowly-writing-framework skill. Review acme/sdk#88, which someone else wrote, and stage your comments. The diff adds `docs/setup.md`. Line 14 reads `Run the instaler before the first build.` and line 30 reads `Set `retries=3 in the config file, then restart.` with an unclosed backtick. Draft the comments for these two findings."
    rubric:
      - "Posts the line 14 typo and the line 30 backtick as two separate line-anchored comments, one point each"
      - "Each comment opens with a plain-text 'nitpick:' label, not bolded or backticked, with a short sentence naming the problem"
      - "Each comment carries a fenced block whose info string is exactly 'suggestion', not a prose-only description such as 'Typo: instaler'"
      - "The line 14 block holds the full corrected line ('installer'); the line 30 block holds the full corrected line with the backtick closed, both anchored to a single line"
      - "Does not use a 'suggestion:' label just to justify the block; the label stays 'nitpick:'"
      - "<!--:robot:--> is the literal last line of each comment"
    graders:
      - type: prompt
        config:
          prompt: "Grade the agent's final answer against every rubric criterion."
          scoring: scale_1_5

scoring:
  threshold: 0.7
