name: review-reply-research-claims
type: capability

agent_environment:
  skills:
    - ../.skill/lowly-writing-framework-eval

defaults:
  runs: 1
  timeout: 5m
  judge_model: claude-sonnet-5.5

stimuli:
  - name: review-reply-research-claims
    prompt: "Use the lowly-writing-framework-eval skill and no other skill. I'm the author of acme/sdk#94. Thread PRRT_mno (first comment id 7001): 'issue: json.loads on the webhook body will raise on duplicate keys, you need to reject those.' I'm not sure that's true, and I'd rather not guess. The repo pins Python 3.12 in pyproject.toml. A second thread, PRRT_pqr (first comment id 7002), says: 'suggestion: split build_report into fetch + format, it does too much.' I agree and pushed the split in commit 4c7e9a21, which makes build_report's formatting testable without the network. Draft both replies and say what you'd verify first. This is a simulated scenario: the repository, PR, and account do not exist and no network or gh call will succeed. Do not run gh or any command that posts or needs the repository; read-only web lookups of public documentation are allowed and required where the rubric calls for research. Reply with the exact artifact text and, for anything that would be posted through gh or a tool, the exact commands you would run, in order."
    rubric:
      - "Before drafting the first reply, the agent looks up how the pinned Python version's json.loads treats duplicate keys in the official docs instead of answering from memory, and opens the page rather than relying on a snippet"
      - "The first reply states the finding first, links the official docs as a named markdown link with the one relevant sentence quoted beside it, and does not use a bare URL or a backticked URL"
      - "If the docs show the reviewer is right, the first reply says Done or what will change and credits the check; if they show the reviewer is wrong, it declines with that quote and names what would change the answer; if the docs are silent, it says what is unverified instead of picking a side"
      - "The second reply is Done in 4c7e9a21 with the SHA unticked, ties the single-responsibility idea to the concrete consequence that formatting is now testable without the network, and does not rely on naming the principle alone"
      - "At most one or two links appear in each reply"
      - "<!--:robot:--> is the literal last line of each reply"
    graders:
      - type: prompt
        config:
          prompt: "Grade the agent's final answer against every rubric criterion."
          scoring: scale_1_5
