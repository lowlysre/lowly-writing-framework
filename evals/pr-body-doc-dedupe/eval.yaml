name: pr-body-doc-dedupe
type: capability

agent_environment:
  skills:
    - ../../skills/lowly-writing-framework

defaults:
  runs: 1
  timeout: 5m
  judge_model: claude-sonnet-5.5

stimuli:
  - name: pr-body-doc-dedupe
    prompt: "Use the lowly-writing-framework skill. Write the PR body for this change in acme/sdk, closing acme/sdk#88, from branch `retry-docs`. The PR adds client request retries and a new `docs/retries.md` with a `## Retry behavior` section that already explains the backoff (200ms doubling to a 10s cap, with jitter), the 3-attempt budget, and that only idempotent methods retry. Retries raise load on a struggling server, so the feature ships behind a `retries` flag that is off by default. No PR template exists. CI runs the existing unit suite on every push. This is a simulated scenario: the repository, PR, and account do not exist and no network or gh call will succeed. Do not run commands. Reply with the exact artifact text and, for anything that would be posted through gh or a tool, the exact commands you would run, in order."
    rubric:
      - "The body does not restate the backoff schedule, jitter, attempt budget, or idempotent-method rule that docs/retries.md already covers"
      - "The body links the Retry behavior section as a named markdown link on the branch ref (blob/retry-docs/docs/retries.md#retry-behavior), not a commit SHA and not a bare URL"
      - "The body keeps a one-line gist beside the link and tells the reviewer to review the rationale there"
      - "The load risk and the off-by-default flag stay in the body, not delegated to the doc"
      - "The body closes acme/sdk#88 with a closing keyword in the full owner/repo#123 form"
      - "The body has at least one ## heading and no top-level # heading"
      - "<!--:robot:--> is the literal last line"
    graders:
      - type: prompt
        config:
          prompt: "Grade the agent's final answer against every rubric criterion."
          scoring: scale_1_5
