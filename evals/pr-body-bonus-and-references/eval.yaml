name: pr-body-bonus-and-references
type: capability

agent_environment:
  skills:
    - ../.skill/lowly-writing-framework-eval

defaults:
  runs: 1
  timeout: 5m
  judge_model: claude-sonnet-5.5

stimuli:
  - name: pr-body-bonus-and-references
    prompt: "Use the lowly-writing-framework-eval skill and no other skill. Write the PR title and body for this change in acme/billing-api. Invoice PDFs rendered blank for invoices with more than 50 line items, because the renderer stopped at the first page break. The fix paginates line items across pages. While in there I also fixed a typo in the invoice footer text. It fixes issue 212 in acme/billing-api, which is a sub-issue of acme/platform#40. The repo's CI runs `pytest` and `ruff` on every push, and I also opened a 120-item invoice in the staging UI by hand. No PR template exists. This is a simulated scenario: the repository, PR, and account do not exist and no network or gh call will succeed. Do not run commands. Reply with the exact artifact text and, for anything that would be posted through gh or a tool, the exact commands you would run, in order."
    rubric:
      - "Every issue reference uses the full owner/repo#123 form in plain text, with no bare #212, no owner-less billing-api#212, and no backticks around any reference"
      - "The body closes the issue with a closing keyword (fixes/closes/resolves acme/billing-api#212) and never uses 'Part of' or 'Relates to'"
      - "The footer typo fix stays out of the main narrative: either an author annotation on the changed line (per the hitchhiker rule in references/pr-writing.md) or its own Bonus/Chores/Also fixed sub-header"
      - "The Testing section mentions the manual staging check and doesn't claim pytest or ruff passed locally"
      - "Each paragraph is a single source line with no hard wraps, and <!--:robot:--> is the literal last line"
    graders:
      - type: prompt
        config:
          prompt: "Grade the agent's final answer against every rubric criterion."
          scoring: scale_1_5
