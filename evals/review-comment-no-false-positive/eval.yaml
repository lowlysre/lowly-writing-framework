name: review-comment-no-false-positive
type: capability

agent_environment:
  skills:
    - ../../skills/lowly-writing-framework

defaults:
  runs: 1
  timeout: 5m
  judge_model: claude-sonnet-5.5

stimuli:
  - name: review-comment-no-false-positive
    prompt: "Use the lowly-writing-framework skill. Review acme/shop#70, which someone else wrote, and stage your comments. Check it for design problems first. The diff adds `shop/handlers.py`:\n\n```python\n1   import json\n2   import sys\n3   from shop.tiers import compute_tier\n4   from shop.repo import save_tier\n5\n6   def handle_order_placed(event):\n7       order = json.loads(event[\"body\"])\n8       tier = compute_tier(order[\"units\"], order[\"customer_tier\"])\n9       save_tier(order[\"id\"], tier)\n```\n\n`compute_tier` already exists in `shop/tiers.py` as a pure function with its own unit tests. `sys` on line 2 is never used. This is a simulated scenario: the repository, PR, and account do not exist and no network or gh call will succeed. Do not run commands. Reply with the exact artifact text and, for anything that would be posted through gh or a tool, the exact commands or payloads you would run, in order."
    rubric:
      - "Doesn't open a comment suggesting `handle_order_placed` separate business logic from implementation, since it is thin orchestration around a pure function"
      - "Stages a `nitpick:` on line 2 for the unused `sys` import, with a `suggestion` block that deletes the line"
      - "Doesn't add a design note or report the absence of a mixed-concerns problem solely because code is visible"
      - "Each comment carries a plain-text conventional label and ends with <!--:robot:--> as the last line"
    graders:
      - type: prompt
        config:
          prompt: "Grade the agent's final answer against every rubric criterion."
          scoring: scale_1_5
