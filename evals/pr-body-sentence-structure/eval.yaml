name: pr-body-sentence-structure
type: capability

agent_environment:
  skills:
    - ../.skill/lowly-writing-framework-eval

defaults:
  runs: 1
  timeout: 5m
  judge_model: claude-sonnet-5.5

stimuli:
  - name: pr-body-sentence-structure
    prompt: "Use the lowly-writing-framework-eval skill and no other skill. Write the PR body for this change in acme/queue-worker, closing acme/queue-worker#88. The worker now retries a failed job up to 5 times with exponential backoff starting at 500ms and capping at 30s, at the cost of holding the job's Redis lock for the whole retry window, especially since a lock held past 60s trips the cluster's stale-lock alarm, so this also raises that alarm's threshold to 90s. No PR template exists. CI runs the unit suite on every push; no new tests were added because the backoff timing is hard to assert deterministically. This is a simulated scenario: the repository, PR, and account do not exist and no network or gh call will succeed. Do not run commands. Reply with the exact artifact text and, for anything that would be posted through gh or a tool, the exact commands you would run, in order."
    rubric:
      - "The backoff/lock/alarm change is split into separate sentences, one point per sentence, not one sentence stacking the mechanism, the tradeoff, and the alarm-threshold consequence behind 'at the cost of'/'especially since' clauses"
      - "The body closes acme/queue-worker#88 with a closing keyword in the full owner/repo#123 form"
      - "The Testing section names the concrete reason the backoff timing wasn't tested (non-deterministic timing) rather than a generic 'all tests pass' claim or an invented test bar"
      - "<!--:robot:--> is the literal last line"
    graders:
      - type: prompt
        config:
          prompt: "Grade the agent's final answer against every rubric criterion."
          scoring: scale_1_5
