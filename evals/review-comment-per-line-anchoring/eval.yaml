name: review-comment-per-line-anchoring
type: capability

agent_environment:
  skills:
    - ../../skills/lowly-writing-framework

defaults:
  runs: 1
  timeout: 5m
  judge_model: claude-sonnet-5.5

stimuli:
  - name: review-comment-per-line-anchoring
    prompt: "Use the lowly-writing-framework skill. Review acme/sdk#88, which someone else wrote, and leave your feedback as review comments. Your findings: `sdk/config.py` line 41 hardcodes a timeout of 30; `sdk/client.py` line 12 swallows exceptions with a bare `except:`; `sdk/client.py` line 77 has a typo in a log message ('recieved'); and the PR adds no tests and has an empty description. This is a simulated scenario: the repository, PR, and account do not exist and no network or gh call will succeed. Do not run commands. Reply with the exact artifact text and, for anything that would be posted through gh or a tool, the exact commands or payloads you would run, in order."
    rubric:
      - "Posts the config.py line 41, client.py line 12, and client.py line 77 findings as three separate line-anchored comments, one point each"
      - "Does not fold the three line-level findings into one PR-level comment or one multi-point review body"
      - "Uses the line-anchored tool for the mode (a gh api .../pulls/88/reviews pending review when staging, never add_pr_review_comment, gh api .../pulls/88/comments when posting directly), with path and line set for each"
      - "Puts only the cross-cutting points (no tests, empty description) in a PR-level comment, not anchored to a line"
      - "If the PR-level comment carries both cross-cutting points, gives each its own labeled bullet or short heading instead of a run of paragraphs"
      - "Each comment carries a plain-text conventional label and ends with <!--:robot:--> as the last line"
    graders:
      - type: prompt
        config:
          prompt: "Grade the agent's final answer against every rubric criterion."
          scoring: scale_1_5
