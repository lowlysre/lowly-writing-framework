name: pr-body-author-annotation
type: capability

agent_environment:
  skills:
    - ../../skills/lowly-writing-framework

defaults:
  runs: 1
  timeout: 5m
  judge_model: claude-sonnet-5.5

stimuli:
  - name: pr-body-author-annotation
    prompt: "Use the lowly-writing-framework skill. The PR for acme/sdk#88 is already open and pushed, opened by `jdoe`; `gh api user` in this session returns `jdoe`. Its body is long because the change adds a retry layer. Two small things are left out of the body so far: in `sdk/http.py` line 31 the `User-Agent` string was bumped to match the new version, and in `settings.yaml` line 12 the `max_retries: 3` value is a placeholder until the platform team publishes real limits. Also, the PR is a breaking change: the `Client.send` return type changed from `dict` to `Response`. Decide where each of these three things goes and write whatever artifacts that implies. This is a simulated scenario: the repository, PR, and account do not exist and no network or gh call will succeed. Do not run commands. Reply with the exact artifact text and, for anything that would be posted through gh or a tool, the exact commands you would run, in order."
    rubric:
      - "The `User-Agent` bump and the `max_retries` placeholder are each written as a separate line-anchored review comment on the stated line, not added to the PR body"
      - "Each annotation starts with `note:` and is one to two sentences"
      - "Each annotation ends with <!--:robot:--> as its literal last line"
      - "The breaking `Client.send` return type change stays in the PR body, with what a consumer has to do about it, and is not moved into a line comment"
      - "Each annotation is posted as a annotated line comment (for example `gh api .../pulls/88/comments`) after the agent compares the PR author with the session's user, not as a pending review and not through `add_pr_review_comment`"
    graders:
      - type: prompt
        config:
          prompt: "Grade the agent's final answer against every rubric criterion."
          scoring: scale_1_5
